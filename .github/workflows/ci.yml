name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (go vet + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: services/backend/go.mod
      - name: Tidy modules
        working-directory: services/backend
        run: go mod tidy
      - name: Vet
        working-directory: services/backend
        run: go vet ./...
      - name: Test
        working-directory: services/backend
        run: go test ./... -count=1
      - name: Build
        working-directory: services/backend
        run: CGO_ENABLED=0 go build ./...

  dnstap-ingester:
    name: dnstap-ingester (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache-dependency-path: services/dnstap-ingester/go.mod
      - name: Build
        working-directory: services/dnstap-ingester
        run: go mod tidy && CGO_ENABLED=0 go build ./...

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build
        working-directory: services/frontend
        # no package-lock.json in repo, so npm install instead of npm ci
        run: npm install --no-audit --no-fund && npm run build

  # Publishes images to GHCR so replicas can `docker compose pull` instead of
  # rebuilding locally (~5 min -> <1 min per update). update.sh still builds
  # locally today; switching it over requires making these packages public
  # (repo Settings -> Packages) or configuring registry auth on each node.
  images:
    name: Publish images to GHCR
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [backend, dnstap-ingester, frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [backend, frontend, dnstap-ingester]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.sha }}
